name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Go 单元 + 集成测试（快速，作为主要守门人）
  go-test:
    name: Go Unit & Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: 编译
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: 单元 + 集成测试
        run: go test ./...

  # E2E 测试（需浏览器 + 串行数据库状态，单独 job）
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'goauth/tests/e2e/package-lock.json'
      - name: 编译服务器二进制
        run: |
          cd goauth
          CGO_ENABLED=1 go build -o bin/goauth ./cmd/server
      - name: 安装 Playwright 依赖
        run: |
          cd goauth/tests/e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: 运行 E2E
        run: |
          cd goauth/tests/e2e
          # 单 worker 串行，避免共享 SQLite 数据库的状态冲突
          GOAUTH_BASE_URL=http://localhost:3000 npx playwright test
        timeout-minutes: 45
      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: goauth/tests/e2e/test-results/
          retention-days: 7
